site_name: PVSnesLib
site_description: Documentation for developing games and applications for the Super Nintendo with PVSnesLib.
site_url: https://alekmaul.github.io/pvsneslib/
repo_url: https://github.com/alekmaul/pvsneslib
repo_name: alekmaul/pvsneslib
edit_uri: edit/master/docs/

copyright: "PVSnesLib contributors"

theme:
  name: material
  language: en
  logo: assets/images/pvsneslib-mark.svg
  favicon: assets/images/favicon.svg
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/games-showcase.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.emoji:
        emoji_index: !!python/name:material.extensions.emoji.twemoji
        emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md

  - Getting started:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
      - First project: getting-started/first-project.md

  - Guides:
      - Overview: tutorials/index.md
      - Graphics and backgrounds: tutorials/graphics.md
      - Sprites: tutorials/sprites.md
      - Controller input: tutorials/input.md
      - Audio: tutorials/audio.md

  - API reference:
      - Overview: api/index.md
      - Graphics: api/graphics.md
      - Sprites: api/sprites.md
      - Audio: api/audio.md
      - Input: api/input.md
      - System and memory: api/system.md

  - Examples and demos: examples/index.md

  - Development tools: tools/index.md

  - SNES hardware: hardware/index.md

  - FAQ: faq/index.md

  - About:
    - Project: project/about.md
    - Documentation and Wiki: project/documentation-and-wiki.md
    - Contributing: project/contributing.md

  - Community Wiki: https://github.com/alekmaul/pvsneslib/wiki
  - Doxygen API: https://alekmaul.github.io/pvsneslib/api/
